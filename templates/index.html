<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto ML Predictor - BTC</title>
    <!-- Conexión limpia al archivo CSS externo -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Crypto ML Predictor</h1>
        <div class="date">Última actualización: {{ data.fecha }}</div>
        
        <div class="price-box">
            <div class="price-label">Precio Actual Real ({{ data.cripto }})</div>
            <div class="price-value">${{ data.precio }} USD</div>
        </div>

        <div>
            <span class="badge badge-{{ data.prediccion }}">
                Predicción Mañana: {{ data.prediccion }} (Prob: {{ data.prob_subir }}%)
            </span>
        </div>

        <!-- El cuadro adapta su clase CSS dinámicamente según la recomendación del backend -->
        <div class="recommendation-box {% if data.recommendation == 'COMPRAR' %}rec-COMPRAR{% elif data.recommendation == 'VENDER' %}rec-VENDER{% else %}rec-MANTENER{% endif %}">
            <div class="rec-label">Sugerencia del Algoritmo</div>
            <div class="rec-action">
                {{ data.recommendation }}
            </div>
            <div class="rec-text">{{ data.motivo }}</div>
        </div>

        <div class="footer">
            {{ data.nota }}
        </div>
    </div>
</body>
</html>
